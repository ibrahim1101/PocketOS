name: PocketOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/m1-linux-boot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android unit tests and native bridge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK and emulator
        run: |
          sdkmanager_path="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager_path" --licenses
          "$sdkmanager_path" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "platform-tools" "cmake;3.22.1" "ndk;27.2.12479018" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Install Android QEMU cross-build tools
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends autoconf automake bison e2fsprogs flex ipxe-qemu libtool ninja-build pkg-config qemu-system-arm
          python3 -m venv "$RUNNER_TEMP/qemu-build-venv"
          "$RUNNER_TEMP/qemu-build-venv/bin/pip" install --timeout 30 --retries 2 "meson==1.7.0"
          echo "$RUNNER_TEMP/qemu-build-venv/bin" >> "$GITHUB_PATH"
      - name: Build packaged executable probe for Android ABIs
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          bash scripts/build-android-exec-probe.sh \
            "$sdk_root/ndk/27.2.12479018" \
            android/app/src/debug/jniLibs
      - name: Fetch pinned QEMU source for Android cross-build
        run: bash scripts/fetch-android-qemu-source.sh "$RUNNER_TEMP/qemu-11.1.2"
      - name: Cross-build Android ARM64 QEMU
        run: |
          sdk_root="$ANDROID_HOME"
          bash scripts/build-android-qemu.sh \
            "$sdk_root/ndk/27.2.12479018" \
            "$RUNNER_TEMP/qemu-11.1.2" \
            android/app/src/debug/jniLibs \
            "$RUNNER_TEMP/android-qemu-build"
      - name: Build and package Alpine Android guest assets
        run: |
          SIZE_MB=256 bash scripts/build-alpine-rootfs.sh "$RUNNER_TEMP/pocketos-guest.ext4"
          bash scripts/check-guest-root-lock.sh "$RUNNER_TEMP/pocketos-guest.ext4"
          bash scripts/package-android-guest-assets.sh \
            "$RUNNER_TEMP/pocketos-guest.ext4" \
            android/app/src/main/assets/pocketos
          find android/app/src/main/assets/pocketos -maxdepth 1 -type f -printf "%f %s bytes\n"
      - name: Boot the exact packaged Alpine assets under host QEMU
        env:
          KERNEL: ${{ github.workspace }}/android/app/src/main/assets/pocketos/vmlinuz-virt
          INITRAMFS: ${{ github.workspace }}/android/app/src/main/assets/pocketos/initramfs-virt
          ROOTFS: ${{ runner.temp }}/pocketos-guest.ext4
          BOOT_TIMEOUT_SECONDS: "120"
        run: bash scripts/check-guest-boot.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      # Preserve the debug signing identity for trusted branch builds so successive
      # development APKs can replace one another with `adb install -r`.
      - name: Restore development debug signing key
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pocketos-debug-signing-v1-${{ github.ref_name }}
      - name: Create debug signing key when cache is empty
        run: |
          set -euo pipefail
          keystore="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$keystore")"
          if [[ ! -s "$keystore" ]]; then
            keytool -genkeypair -noprompt \
              -keystore "$keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Start Android x86_64 emulator
        run: |
          set -euxo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$sdk_root/platform-tools:$sdk_root/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || true
          echo "no" | "$sdk_root/cmdline-tools/latest/bin/avdmanager" create avd -n pocketos-ci -k "system-images;android-35;google_apis;x86_64" --device pixel_2 --force
          "$sdk_root/cmdline-tools/latest/bin/avdmanager" list avd
          "$sdk_root/emulator/emulator" -avd pocketos-ci -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          if ! timeout 120s adb wait-for-device; then
            cat "$RUNNER_TEMP/emulator.log"
            kill "$emulator_pid" || true
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then
            cat "$RUNNER_TEMP/emulator.log"
            adb devices -l
            kill "$emulator_pid" || true
            exit 1
          fi
      - name: Build app and instrumentation APKs from this commit
        run: |
          set -euo pipefail
          gradle -p android testDebugUnitTest assembleDebug assembleDebugAndroidTest
          app_apk=android/app/build/outputs/apk/debug/app-debug.apk
          test_apk=android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s "$app_apk"
          test -s "$test_apk"
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          aapt="$sdk_root/build-tools/35.0.0/aapt"
          "$aapt" dump badging "$app_apk" | grep -F "package: name='com.pocketos.app'"
          "$aapt" dump badging "$test_apk" | grep -F "package: name='com.pocketos.app.test'"
          for asset in vmlinuz-virt initramfs-virt rootfs.ext4.gzip assets.sha256; do
            unzip -Z1 "$app_apk" | grep -Fx "assets/pocketos/$asset"
          done
          asset_check_dir="$(mktemp -d)"
          trap 'rm -rf "$asset_check_dir"' EXIT
          unzip -q "$app_apk" 'assets/pocketos/*' -d "$asset_check_dir"
          (cd "$asset_check_dir/assets/pocketos" && sha256sum -c assets.sha256)
          for library in lib/arm64-v8a/libqemu-system-aarch64.so lib/arm64-v8a/libpocketos_vm.so lib/x86_64/libpocketos_vm.so; do
            unzip -Z1 "$app_apk" | grep -Fx "$library"
          done
          unzip -Z1 "$test_apk" | grep -F "classes.dex"
          apksigner="$sdk_root/build-tools/35.0.0/apksigner"
          app_certificate="$("$apksigner" verify --print-certs "$app_apk" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')"
          test_certificate="$("$apksigner" verify --print-certs "$test_apk" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')"
          keystore_certificate="$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | awk '{print $1}')"
          test -n "$app_certificate"
          test "$app_certificate" = "$test_certificate"
          if [[ "${app_certificate,,}" != "${keystore_certificate,,}" ]]; then
            echo "APK signer does not match the persisted development keystore" >&2
            echo "APK signer SHA-256: $app_certificate" >&2
            echo "Keystore SHA-256: $keystore_certificate" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$app_apk" dist/PocketOS-debug.apk
          cp "$test_apk" dist/PocketOS-androidTest.apk
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            signing_kind="ephemeral-pull-request-debug"
          else
            signing_kind="cached-branch-debug"
          fi
          printf 'commit=%s\nsigning-kind=%s\nsigning-certificate-sha256=%s\n' \
            '${{ github.event.pull_request.head.sha || github.sha }}' "$signing_kind" "$app_certificate" > dist/build-info.txt
          sha256sum dist/PocketOS-debug.apk dist/PocketOS-androidTest.apk > dist/SHA256SUMS
      - name: Verify packaged native library ABI and dependencies
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          python3 scripts/check-apk-native-abis.py \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "$sdk_root/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
      - name: Run Android native bridge instrumentation tests
        run: gradle -p android connectedDebugAndroidTest
      - name: Exercise Windows handoff commands against real Android ADB
        shell: pwsh
        run: |
          $env:PATH = "${env:ANDROID_HOME}/platform-tools" + [IO.Path]::PathSeparator + $env:PATH
          ./scripts/test-vivo-adb.ps1 -Serial emulator-5554
      - name: Upload Android app APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocketos-android-apk-${{ github.event.pull_request.head.sha || github.sha }}${{ github.event_name == 'pull_request' && '-pull-request' || '' }}
          path: dist/PocketOS-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android instrumentation APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pocketos-instrumentation-apk-${{ github.event.pull_request.head.sha || github.sha }}${{ github.event_name == 'pull_request' && '-pull-request' || '' }}
          path: dist/PocketOS-androidTest.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload build identity and Android emulator test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketos-test-handoff-${{ github.event.pull_request.head.sha || github.sha }}${{ github.event_name == 'pull_request' && '-pull-request' || '' }}
          path: |
            dist/build-info.txt
            dist/SHA256SUMS
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 14

  android-16:
    name: Android 16 delivery APK regression tests
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Test the delivery APKs themselves; do not compile a separate candidate.
      - uses: actions/download-artifact@v4
        with:
          name: pocketos-android-apk-${{ github.event.pull_request.head.sha || github.sha }}${{ github.event_name == 'pull_request' && '-pull-request' || '' }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: pocketos-instrumentation-apk-${{ github.event.pull_request.head.sha || github.sha }}${{ github.event_name == 'pull_request' && '-pull-request' || '' }}
          path: dist
      - name: Install Android 16 emulator image
        timeout-minutes: 8
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
      - name: Boot Android 16 and test the signed delivery APK pair
        timeout-minutes: 10
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$sdk_root/platform-tools:$sdk_root/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod 666 /dev/kvm
          echo "no" | "$sdk_root/cmdline-tools/latest/bin/avdmanager" create avd -n pocketos-api36 -k "system-images;android-36;google_apis;x86_64" --device pixel_2 --force
          "$sdk_root/emulator/emulator" -list-avds | grep -Fx pocketos-api36
          "$sdk_root/emulator/emulator" -avd pocketos-api36 -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -accel on > emulator-api36.log 2>&1 &
          emulator_pid=$!
          trap 'timeout 10s adb logcat -d -s PocketOSRuntimeTest:I AndroidRuntime:E > logcat-api36.txt 2>&1 || true; timeout 5s adb shell am force-stop com.pocketos.app >/dev/null 2>&1 || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          if ! timeout 120s adb wait-for-device; then
            cat emulator-api36.log
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 120); do
            if [[ "$(timeout 5s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          test "$booted" = true
          test "$(adb shell getprop ro.build.version.sdk | tr -d '\r')" = 36
          adb shell input keyevent KEYCODE_WAKEUP
          adb install -r dist/PocketOS-debug.apk
          adb install -r dist/PocketOS-androidTest.apk
          pwsh -NoProfile -NonInteractive -File scripts/test-vivo-adb.ps1 -Serial emulator-5554
          timeout --kill-after=10s 300s adb shell am instrument -w -r com.pocketos.app.test/androidx.test.runner.AndroidJUnitRunner > instrumentation-api36.txt 2>&1
          cat instrumentation-api36.txt
          python3 - <<'PY'
          import pathlib, re
          output = pathlib.Path("instrumentation-api36.txt").read_text()
          assert re.search(r"OK \(\d+ tests?\)", output), "Instrumentation did not report success"
          assert not re.search(r"FAILURES!!!|INSTRUMENTATION_FAILED|Process crashed", output), "Instrumentation failed"
          assert len(re.findall(r"INSTRUMENTATION_STATUS_CODE: -(?:3|4)\b", output)) == 3, "Expected only the three ARM64-specific skips on x86_64"
          PY
      - name: Collect Android 16 diagnostics
        if: always()
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [[ ! -s logcat-api36.txt ]]; then
            timeout 10s "$sdk_root/platform-tools/adb" logcat -d -s PocketOSRuntimeTest:I AndroidRuntime:E > logcat-api36.txt 2>&1 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocketos-android16-results-${{ github.event.pull_request.head.sha || github.sha }}${{ github.event_name == 'pull_request' && '-pull-request' || '' }}
          path: |
            instrumentation-api36.txt
            emulator-api36.log
            logcat-api36.txt
          if-no-files-found: warn
          retention-days: 14

  windows-handoff:
    name: Windows PowerShell handoff regression tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test native Windows argument handling, sanitization, and supervision
        shell: pwsh
        run: |
          ./scripts/test-vivo-adb.ps1
          ./scripts/test-vivo-sanitizer.ps1
          ./scripts/test-vivo-supervision.ps1
      - name: Test Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          ./scripts/test-vivo-adb.ps1
          ./scripts/test-vivo-sanitizer.ps1
          ./scripts/test-vivo-supervision.ps1

  guest-boot:
    name: Alpine ARM64 guest build and boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-qemu-action@v3
      - name: Install QEMU and validation tools
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends e2fsprogs ipxe-qemu qemu-system-arm shellcheck
      - name: Check shell scripts
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh
      - name: Parse Windows physical-test handoff
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/test-vivo.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
      - name: Test diagnostic sanitization
        shell: pwsh
        run: |
          ./scripts/test-vivo-sanitizer.ps1
          ./scripts/test-vivo-supervision.ps1
          ./scripts/test-vivo-adb.ps1
      - name: Fetch and verify pinned Android QEMU source
        run: |
          bash scripts/fetch-android-qemu-source.sh "$RUNNER_TEMP/qemu-11.1.2"
          test -x "$RUNNER_TEMP/qemu-11.1.2/configure"
      - name: Check Python guest probe syntax
        run: python3 -m py_compile scripts/check-guest-shell.py scripts/check-guest-persistence.py scripts/check-guest-http.py scripts/check-guest-firstboot.py scripts/check-guest-python-http.py
      - name: Build an ARM64 Alpine disk
        run: SIZE_MB=512 bash scripts/build-alpine-rootfs.sh "$RUNNER_TEMP/alpine-aarch64.ext4"
      - name: Verify guest root account is locked
        run: bash scripts/check-guest-root-lock.sh "$RUNNER_TEMP/alpine-aarch64.ext4"
      - name: Extract Alpine's QEMU virtual kernel
        run: debugfs -R "dump /boot/vmlinuz-virt $RUNNER_TEMP/vmlinuz-virt" "$RUNNER_TEMP/alpine-aarch64.ext4"
      - name: Extract matching Alpine initramfs
        run: debugfs -R "dump /boot/initramfs-virt $RUNNER_TEMP/initramfs-virt" "$RUNNER_TEMP/alpine-aarch64.ext4"
      - name: Boot guest to first-run password prompt
        env:
          KERNEL: ${{ runner.temp }}/vmlinuz-virt
          INITRAMFS: ${{ runner.temp }}/initramfs-virt
          ROOTFS: ${{ runner.temp }}/alpine-aarch64.ext4
          BOOT_TIMEOUT_SECONDS: "120"
        run: bash scripts/check-guest-boot.sh
      - name: Keep serial setup available during a blocked OpenRC boot service
        run: >-
          timeout --kill-after=10s 180s python3 scripts/check-guest-firstboot.py
          --kernel "$RUNNER_TEMP/vmlinuz-virt"
          --initramfs "$RUNNER_TEMP/initramfs-virt"
          --rootfs "$RUNNER_TEMP/alpine-aarch64.ext4"
          --timeout 120
          --simulate-openrc-stall
      - name: Exercise first-run account setup and non-root login
        run: >-
          python3 scripts/check-guest-firstboot.py
          --kernel "$RUNNER_TEMP/vmlinuz-virt"
          --initramfs "$RUNNER_TEMP/initramfs-virt"
          --rootfs "$RUNNER_TEMP/alpine-aarch64.ext4"
          --timeout 120
          --grow-by-mib 128
      - name: Execute Linux commands in the guest shell
        run: >-
          python3 scripts/check-guest-shell.py
          --kernel "$RUNNER_TEMP/vmlinuz-virt"
          --initramfs "$RUNNER_TEMP/initramfs-virt"
          --rootfs "$RUNNER_TEMP/alpine-aarch64.ext4"
          --timeout 120
      - name: Verify guest disk persistence across restart
        run: >-
          python3 scripts/check-guest-persistence.py
          --kernel "$RUNNER_TEMP/vmlinuz-virt"
          --initramfs "$RUNNER_TEMP/initramfs-virt"
          --rootfs "$RUNNER_TEMP/alpine-aarch64.ext4"
          --timeout 120
      - name: Verify localhost HTTP forwarding from guest
        run: >-
          python3 scripts/check-guest-http.py
          --kernel "$RUNNER_TEMP/vmlinuz-virt"
          --initramfs "$RUNNER_TEMP/initramfs-virt"
          --rootfs "$RUNNER_TEMP/alpine-aarch64.ext4"
          --timeout 120
      - name: Install Python and verify a guest HTTP workload
        run: >-
          timeout --kill-after=10s 900s python3 scripts/check-guest-python-http.py
          --kernel "$RUNNER_TEMP/vmlinuz-virt"
          --initramfs "$RUNNER_TEMP/initramfs-virt"
          --rootfs "$RUNNER_TEMP/alpine-aarch64.ext4"
          --timeout 240

